apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
spec:
  rules:
    - host: app-1
      http:
        paths:
          - path: '/'
            pathType: Prefix
            backend:
              service:
                name: app-1-service
                port:
                  number: 80
    - host: app-2
      http:
        paths:
          - path: '/'
            pathType: Prefix
            backend:
              service:
                name: app-2-service
                port:
                  number: 80
    - http:
        paths:
          - path: '/'
            pathType: Prefix
            backend:
              service:
                name: app-3-service
                port:
                  number: 80
