apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-app-default
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HoelK/hkeromne-iot-app
    path: manifests
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
