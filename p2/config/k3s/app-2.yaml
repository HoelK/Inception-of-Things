apiVersion: v1
kind: ConfigMap
metadata:
  name: app-2-html-map
data:
  index.html: | 
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App-1</title>
    <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      }

      h1 {
        color: #333;
        font-size: 3rem;
      }
      </style>
      </head>
      <body>
      <h1>Welcome to app-2</h1>
      </body>
      </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-2-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-2-pod
  template:
    metadata:
      labels:
        app: app-2-pod
    spec:
      containers:
        - name: app-2-container
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf-volume
              mountPath: /etc/nginx/conf.d
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: nginx-conf-volume
          configMap:
            name: nginx-conf-map
        - name: html-volume
          configMap:
             name: app-2-html-map
---
apiVersion: v1
kind: Service
metadata:
  name: app-2-service
spec:
  selector:
    app: app-2-pod
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
